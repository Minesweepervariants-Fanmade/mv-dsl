[project]
name = "mv-dsl"
version = "0.1.0"
description = "Declarative rule DSL and CP-SAT solver for 14 Minesweeper Variants 1/2"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Moon" }]
dependencies = [
    "ortools>=9.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mv_dsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
